<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="80" cy="80" r="76" fill="#ffffff" stroke="#f1f5f9" stroke-width="2" filter="url(#badge-shadow)"/>
  
  <g transform="translate(25, 38)">
    <!-- 'M' with sail shape -->
    <path d="M 5 58 L 5 18 C 10 18, 16 26, 20 34 C 23 26, 28 18, 33 18 L 33 58 L 26 58 L 26 31 L 21 42 L 17 42 L 12 31 L 12 58 Z" fill="#0284c7"/>
    <!-- Sail detail in M -->
    <path d="M 8 50 C 14 45, 16 35, 17 25 C 19 36, 17 47, 8 50 Z" fill="#38bdf8" opacity="0.8"/>
    
    <!-- 'E' in bright yellow/gold -->
    <path d="M 40 18 L 68 18 L 68 26 L 49 26 L 49 34 L 65 34 L 65 42 L 49 42 L 49 50 L 68 50 L 68 58 L 40 58 Z" fill="#f59e0b"/>
    
    <!-- Tram icon / T block -->
    <g transform="translate(73, 14)">
      <!-- Pantograph / horn on top -->
      <path d="M 17 0 L 12 5 L 22 5 Z" fill="#f59e0b"/>
      <line x1="17" y1="0" x2="17" y2="7" stroke="#0284c7" stroke-width="2.5"/>
      <!-- Tram body -->
      <rect x="2" y="7" width="30" height="38" rx="6" fill="#0284c7"/>
      <!-- Windshield -->
      <rect x="6" y="11" width="22" height="14" rx="3" fill="#ffffff"/>
      <line x1="17" y1="11" x2="17" y2="25" stroke="#0284c7" stroke-width="1.5"/>
      <!-- Headlights -->
      <circle cx="9" cy="36" r="3" fill="#ffffff"/>
      <circle cx="25" cy="36" r="3" fill="#ffffff"/>
      <!-- Bumper line -->
      <rect x="12" y="38" width="10" height="3" rx="1.5" fill="#f59e0b"/>
    </g>
    
    <!-- Subtitle text -->
    <text x="55" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#0369a1" letter-spacing="0.5" text-anchor="middle">МИКОЛАЇВЕЛЕКТРОТРАНС</text>
  </g>
</svg>
